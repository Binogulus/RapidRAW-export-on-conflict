name: 'Build Multi-OS (Private Test)'

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab at any time
  push:
    tags:
      - 'v*' # Automatically triggers when pushing a version tag (e.g. v1.6.4-test1)

jobs:
  build:
    name: Build for ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: 'Linux (AppImage & DEB)'
            os: 'ubuntu-24.04'
            artifact-name: 'RapidRAW-Linux-x86_64'
            artifact-path: |
              src-tauri/target/release/bundle/**/*.AppImage
              src-tauri/target/release/bundle/**/*.deb
          - name: 'Windows 11 (x64 Installer & Portable)'
            os: 'windows-latest'
            artifact-name: 'RapidRAW-Windows-x64'
            artifact-path: |
              src-tauri/target/release/bundle/**/*.exe
              src-tauri/target/release/bundle/**/*.msi
              src-tauri/target/release/bundle/portable/*.zip
          - name: 'macOS (Apple Silicon DMG)'
            os: 'macos-latest'
            artifact-name: 'RapidRAW-macOS-AppleSilicon'
            artifact-path: |
              src-tauri/target/release/bundle/**/*.dmg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ''

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config

      - name: Install frontend dependencies
        run: npm install

      - name: Build with tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: ${{ startsWith(matrix.platform.os, 'ubuntu') }}
        with:
          args: --verbose

      - name: Package Windows True Portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $portableRoot = "src-tauri/target/release/bundle/portable"
          $appDir = "$portableRoot/RapidRAW-Portable"

          New-Item -ItemType Directory -Force -Path $appDir | Out-Null
          New-Item -ItemType Directory -Force -Path "$appDir/portable_data" | Out-Null
          Set-Content -Path "$appDir/portable.txt" -Value "RapidRAW True Portable Mode enabled. All settings, cache, database, LUTs, AI models, and WebView2 data are stored in ./portable_data/"

          Copy-Item "src-tauri/target/release/RapidRAW.exe" -Destination "$appDir/"
          Get-ChildItem "src-tauri/target/release/*.dll" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName -Destination "$appDir/"
          }
          Copy-Item "src-tauri/resources" -Destination "$appDir/resources" -Recurse -Force
          Copy-Item "src-tauri/lensfun_db" -Destination "$appDir/lensfun_db" -Recurse -Force

          $zipPath = "$portableRoot/RapidRAW_v${version}_windows_x64_Portable.zip"
          Compress-Archive -Path "$appDir/*" -DestinationPath $zipPath -Force
          Remove-Item -Recurse -Force $appDir
          Write-Host "Created portable archive: $zipPath"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.artifact-name }}
          path: ${{ matrix.platform.artifact-path }}
          retention-days: 14
          if-no-files-found: error
